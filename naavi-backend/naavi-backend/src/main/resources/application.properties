spring.application.name=naavi-backend
# Optional local .env file (KEY=VALUE lines). Real environment variables also work.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/naavi}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yaman123}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

naavi.jwt.secret=${JWT_SECRET}
naavi.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

naavi.groq.api-key=${GROQ_API_KEY}
naavi.groq.base-url=https://api.groq.com/openai/v1
naavi.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
naavi.groq.temperature=0.4
naavi.groq.max-tokens=6000
naavi.groq.timeout-seconds=120

naavi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Travel tools (all free, no key). Override only if you self-host or switch providers.
naavi.tools.geocoding-url=${GEOCODING_URL:https://geocoding-api.open-meteo.com}
naavi.tools.overpass-urls=${OVERPASS_URLS:https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter}
